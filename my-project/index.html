<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>Café Tech</title>
</head>

<body>
  <header>
    <h1 class="text-4xl font-bold pb-20 px-2 tracking-tighter text-balance max-lg:font-medium max-sm:px-4 sm:text-5xl lg:text-6xl xl:text-8xl">Café Tech</h1>
  </header>

  <section>
    <h2 class="mt-2 text-3xl font-medium tracking-tight text-gray-950 dark:text-black" >Cardápio</h2>
    <button class="py-2 px-4 rounded-full bg-violet-500 hover:bg-violet-600 focus:outline-2 focus:outline-offset-2 focus:outline-violet-500 active:bg-violet-700">
      Dev.io
    </button>

    <div class="flex justify-between w-full pt-20">
      <div class="w-1/2 bg-blue-200 p-4">
        <h3 class="font-bold pb-5">Bebidas</h3>

        <ul>
          <li>Café Expresso<br>R$ 6,00</li>
          <li>Capucciono<br>R$ 10,00</li>
          <li>Chocolate Quente<br>R$ 9,00</li>
        </ul>
      </div>

      <div class="w-1/2 bg-blue-200 py-2 px-4 rounded-full">
        <h3 class="font-bold pb-5">Lanches</h3>

        <ul>
          <li>Pão de Queijo<br>R$ 7,00</li>
          <li>Croissant<br>R$ 12,00</li>
        </ul>
      </div>
    </div>
  </section>

</body>

</html>
